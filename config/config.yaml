# Docket User Configuration
# This file overrides config/defaults.yaml.
# Environment variables override both: DOCKET_SERVER_PORT=8080

docket:
  version: "0.2.0"

  adapters:
    llm:
      default: "lm-studio"
      providers:
        lm-studio:
          adapter: "@docket/llm-openai-compatible"
          config:
            baseUrl: "http://localhost:1234/v1"
            model: "local-model"
            timeout: 30000

    embedder:
      default: "ollama"
      providers:
        ollama:
          adapter: "@docket/embedder-ollama"
          config:
            baseUrl: "http://localhost:11434"
            model: "nomic-embed-text"
            dimensions: 768

    store:
      default: "sqlite"
      providers:
        sqlite:
          adapter: "@docket/store-sqlite"
          config:
            path: "./data/docket.db"
            enableWAL: true
            busyTimeout: 5000

    blob:
      default: "filesystem"
      providers:
        filesystem:
          adapter: "@docket/blob-filesystem"
          config:
            basePath: "./data/blobs"
            maxFileSize: "100mb"

    queue:
      default: "in-memory"
      providers:
        in-memory:
          adapter: "@docket/queue-memory"
          config:
            maxConcurrent: 5
            retryAttempts: 3
            retryDelay: 1000

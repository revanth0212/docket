# Cortex Default Configuration
# Works out of the box with zero setup — just start Ollama locally

cortex:
  version: "0.2.0"

  server:
    port: 3000
    host: "127.0.0.1"

  logging:
    level: "info"  # debug | info | warn | error
    format: "pretty"  # pretty | json

  # Memory Semantics (NEW in v0.2.0)
  memory:
    # flat = simple RAG (v0.1.0 behavior)
    # rich = cognitive memory with sectors, decay, temporal graph, RBAC
    mode: "flat"

    sectors:
      enabled: true
      # Supported sectors. LLM classifies into one of these on ingestion.
      types: ["episodic", "semantic", "procedural", "emotional", "reflective"]
      default: "semantic"
      # Override the classification prompt. Leave empty for built-in.
      classificationPrompt: ""
      # Cache classification results to avoid re-classifying on re-ingest
      cacheClassifications: true

    decay:
      enabled: true
      # Background job interval (ms). Set to 0 to disable background decay.
      interval: 3600000  # 1 hour
      # Decay function per sector. type: none | linear | exponential
      functions:
        episodic:
          type: "exponential"
          halfLifeDays: 30
        semantic:
          type: "none"
        procedural:
          type: "exponential"
          halfLifeDays: 90
        emotional:
          type: "exponential"
          halfLifeDays: 7
        reflective:
          type: "linear"
          halfLifeDays: 365
      # Minimum salience before a memory is considered "forgotten"
      # Forgotten memories are excluded from search but retained in store.
      forgottenThreshold: 0.05

    temporal:
      enabled: true
      # Default validity window for new memories (null = indefinite)
      defaultValidFrom: null
      defaultValidTo: null
      # Allow point-in-time queries via the query API
      pointInTimeQueries: true

    rbac:
      enabled: true
      # How principals are extracted from requests
      # header = read X-Principal header
      # jwt = verify JWT token, extract sub
      # apiKey = lookup API key in store
      authStrategy: "header"
      # Header name when authStrategy is "header"
      principalHeader: "X-Principal"
      # Default access policy for new memories
      # owner-only = only creator can read/write
      # readers = creator + listed readers
      # public = anyone can read
      defaultPolicy: "owner-only"
      # Named policies that can be referenced by name
      policies:
        public:
          readers: ["*"]
          writers: []
        team:
          readers: ["group:team"]
          writers: ["group:team"]

  adapters:
    llm:
      default: "ollama"
      providers:
        ollama:
          adapter: "@cortex/llm-ollama"
          config:
            baseUrl: "http://localhost:11434"
            model: "llama3.2"
            timeout: 30000
            # For insight generation
            systemPrompt: "You are a helpful assistant analyzing personal memories."
        lm-studio:
          adapter: "@cortex/llm-openai-compatible"
          config:
            baseUrl: "http://localhost:1234/v1"
            model: "local-model"
            timeout: 30000
        openai:
          adapter: "@cortex/llm-openai-compatible"
          config:
            baseUrl: "https://api.openai.com/v1"
            apiKey: "${OPENAI_API_KEY:-}"
            model: "gpt-4o-mini"
            timeout: 30000
        kimi:
          adapter: "@cortex/llm-openai-compatible"
          config:
            baseUrl: "https://api.moonshot.cn/v1"
            apiKey: "${CORTEX_KIMI_API_KEY:-}"
            model: "kimi-k2"
            timeout: 60000

    embedder:
      default: "ollama"
      providers:
        ollama:
          adapter: "@cortex/embedder-ollama"
          config:
            baseUrl: "http://localhost:11434"
            model: "nomic-embed-text"
            dimensions: 768
        lm-studio:
          adapter: "@cortex/embedder-openai-compatible"
          config:
            baseUrl: "http://localhost:1234/v1"
            model: "local-model"
            dimensions: 768
            timeout: 30000
        openai:
          adapter: "@cortex/embedder-openai-compatible"
          config:
            baseUrl: "https://api.openai.com/v1"
            apiKey: "${OPENAI_API_KEY:-}"
            model: "text-embedding-3-small"
            dimensions: 1536
            timeout: 30000

    store:
      default: "sqlite"
      providers:
        sqlite:
          adapter: "@cortex/store-sqlite"
          config:
            path: "./data/cortex.db"
            enableWAL: true
            busyTimeout: 5000
        postgres:
          adapter: "@cortex/store-postgres"
          config:
            connectionString: "${DATABASE_URL:-}"
            poolSize: 10

    blob:
      default: "filesystem"
      providers:
        filesystem:
          adapter: "@cortex/blob-filesystem"
          config:
            basePath: "./data/blobs"
            maxFileSize: "100mb"
        s3:
          adapter: "@cortex/blob-s3"
          config:
            endpoint: "${S3_ENDPOINT:-}"
            bucket: "${S3_BUCKET:-}"
            accessKeyId: "${S3_ACCESS_KEY:-}"
            secretAccessKey: "${S3_SECRET_KEY:-}"
            region: "${S3_REGION:-}"

    queue:
      default: "in-memory"
      providers:
        in-memory:
          adapter: "@cortex/queue-memory"
          config:
            maxConcurrent: 5
            retryAttempts: 3
            retryDelay: 1000

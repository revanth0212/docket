# Docket Default Configuration
# Works out of the box with zero setup — just start Ollama locally

docket:
  version: "0.2.0"

  server:
    port: 3000
    host: "127.0.0.1"

  logging:
    level: "info"  # debug | info | warn | error
    format: "pretty"  # pretty | json

  # Memory Semantics (NEW in v0.2.0)
  memory:
    # flat = simple RAG (v0.1.0 behavior)
    # rich = cognitive memory with sectors, decay, temporal graph, RBAC
    mode: "flat"

    sectors:
      enabled: true
      # Supported sectors. LLM classifies into one of these on ingestion.
      types: ["episodic", "semantic", "procedural", "emotional", "reflective"]
      default: "semantic"
      # Override the classification prompt. Leave empty for built-in.
      classificationPrompt: ""
      # Cache classification results to avoid re-classifying on re-ingest
      cacheClassifications: true

    decay:
      enabled: true
      # Background job interval (ms). Set to 0 to disable background decay.
      interval: 3600000  # 1 hour
      # Decay function per sector. type: none | linear | exponential
      functions:
        episodic:
          type: "exponential"
          halfLifeDays: 30
        semantic:
          type: "none"
        procedural:
          type: "exponential"
          halfLifeDays: 90
        emotional:
          type: "exponential"
          halfLifeDays: 7
        reflective:
          type: "linear"
          halfLifeDays: 365
      # Minimum salience before a memory is considered "forgotten"
      # Forgotten memories are excluded from search but retained in store.
      forgottenThreshold: 0.05

    temporal:
      enabled: true
      # Default validity window for new memories (null = indefinite)
      defaultValidFrom: null
      defaultValidTo: null
      # Allow point-in-time queries via the query API
      pointInTimeQueries: true

    rbac:
      enabled: true
      # How principals are extracted from requests
      # header = read X-Principal header
      # jwt = verify JWT token, extract sub
      # apiKey = lookup API key in store
      authStrategy: "header"
      # Header name when authStrategy is "header"
      principalHeader: "X-Principal"
      # Default access policy for new memories
      # owner-only = only creator can read/write
      # readers = creator + listed readers
      # public = anyone can read
      defaultPolicy: "owner-only"
      # Named policies that can be referenced by name
      policies:
        public:
          readers: ["*"]
          writers: []
        team:
          readers: ["group:team"]
          writers: ["group:team"]

  adapters:
    llm:
      default: "ollama"
      providers:
        ollama:
          adapter: "@docket/llm-ollama"
          config:
            baseUrl: "http://localhost:11434"
            model: "llama3.2"
            timeout: 30000
            # For insight generation
            systemPrompt: "You are a helpful assistant analyzing personal memories."
        lm-studio:
          adapter: "@docket/llm-openai-compatible"
          config:
            baseUrl: "http://localhost:1234/v1"
            model: "local-model"
            timeout: 30000
        openai:
          adapter: "@docket/llm-openai-compatible"
          config:
            baseUrl: "https://api.openai.com/v1"
            apiKey: "${OPENAI_API_KEY:-}"
            model: "gpt-4o-mini"
            timeout: 30000
        kimi:
          adapter: "@docket/llm-openai-compatible"
          config:
            baseUrl: "https://api.moonshot.cn/v1"
            apiKey: "${DOCKET_KIMI_API_KEY:-}"
            model: "kimi-k2"
            timeout: 60000
        # --- Cloud provider LLM options ---
        aws-bedrock:
          adapter: "@docket/llm-aws-bedrock"
          config:
            region: "${AWS_REGION:-us-east-1}"
            accessKeyId: "${AWS_ACCESS_KEY_ID:-}"
            secretAccessKey: "${AWS_SECRET_ACCESS_KEY:-}"
            model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
            timeout: 60000
        cloudflare-workers-ai:
          adapter: "@docket/llm-cloudflare-workers-ai"
          config:
            accountId: "${CF_ACCOUNT_ID:-}"
            apiToken: "${CF_API_TOKEN:-}"
            model: "@cf/meta/llama-3.1-8b-instruct"
            timeout: 30000
        gcp-vertex-ai:
          adapter: "@docket/llm-gcp-vertex"
          config:
            projectId: "${GCP_PROJECT_ID:-}"
            location: "${GCP_LOCATION:-us-central1}"
            model: "gemini-1.5-flash"
            credentialsPath: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
            timeout: 60000
        azure-openai:
          adapter: "@docket/llm-azure-openai"
          config:
            endpoint: "${AZURE_OPENAI_ENDPOINT:-}"
            apiKey: "${AZURE_OPENAI_API_KEY:-}"
            deployment: "${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}"
            apiVersion: "2024-08-01-preview"
            timeout: 60000

    embedder:
      default: "ollama"
      providers:
        ollama:
          adapter: "@docket/embedder-ollama"
          config:
            baseUrl: "http://localhost:11434"
            model: "nomic-embed-text"
            dimensions: 768
        lm-studio:
          adapter: "@docket/embedder-openai-compatible"
          config:
            baseUrl: "http://localhost:1234/v1"
            model: "local-model"
            dimensions: 768
            timeout: 30000
        openai:
          adapter: "@docket/embedder-openai-compatible"
          config:
            baseUrl: "https://api.openai.com/v1"
            apiKey: "${OPENAI_API_KEY:-}"
            model: "text-embedding-3-small"
            dimensions: 1536
            timeout: 30000
        # --- Cloud provider embedder options ---
        aws-bedrock:
          adapter: "@docket/embedder-aws-bedrock"
          config:
            region: "${AWS_REGION:-us-east-1}"
            accessKeyId: "${AWS_ACCESS_KEY_ID:-}"
            secretAccessKey: "${AWS_SECRET_ACCESS_KEY:-}"
            model: "amazon.titan-embed-text-v2:0"
            dimensions: 1024
            timeout: 30000
        cloudflare-workers-ai:
          adapter: "@docket/embedder-cloudflare-workers-ai"
          config:
            accountId: "${CF_ACCOUNT_ID:-}"
            apiToken: "${CF_API_TOKEN:-}"
            model: "@cf/baai/bge-base-en-v1.5"
            dimensions: 768
            timeout: 30000
        gcp-vertex-ai:
          adapter: "@docket/embedder-gcp-vertex"
          config:
            projectId: "${GCP_PROJECT_ID:-}"
            location: "${GCP_LOCATION:-us-central1}"
            model: "text-embedding-004"
            dimensions: 768
            credentialsPath: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
            timeout: 30000
        azure-openai:
          adapter: "@docket/embedder-azure-openai"
          config:
            endpoint: "${AZURE_OPENAI_ENDPOINT:-}"
            apiKey: "${AZURE_OPENAI_API_KEY:-}"
            deployment: "${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}"
            apiVersion: "2024-08-01-preview"
            dimensions: 1536
            timeout: 30000

    store:
      default: "sqlite"
      providers:
        sqlite:
          adapter: "@docket/store-sqlite"
          config:
            path: "./data/docket.db"
            enableWAL: true
            busyTimeout: 5000
        # --- Cloud provider store options ---
        cloudflare-d1:
          adapter: "@docket/store-cloudflare-d1"
          config:
            accountId: "${CF_ACCOUNT_ID:-}"
            databaseId: "${CF_D1_DATABASE_ID:-}"
            apiToken: "${CF_API_TOKEN:-}"
        aws-dynamodb:
          adapter: "@docket/store-dynamodb"
          config:
            region: "${AWS_REGION:-us-east-1}"
            tableName: "${DYNAMODB_TABLE:-docket}"
            accessKeyId: "${AWS_ACCESS_KEY_ID:-}"
            secretAccessKey: "${AWS_SECRET_ACCESS_KEY:-}"
        postgres:
          adapter: "@docket/store-postgres"
          config:
            connectionString: "${DATABASE_URL:-}"
            poolSize: 10
        gcp-firestore:
          adapter: "@docket/store-firestore"
          config:
            projectId: "${GCP_PROJECT_ID:-}"
            databaseId: "${GCP_FIRESTORE_DATABASE:-(default)}"
        azure-cosmos:
          adapter: "@docket/store-cosmos"
          config:
            endpoint: "${AZURE_COSMOS_ENDPOINT:-}"
            key: "${AZURE_COSMOS_KEY:-}"
            databaseId: "${AZURE_COSMOS_DATABASE:-docket}"

    blob:
      default: "filesystem"
      providers:
        filesystem:
          adapter: "@docket/blob-filesystem"
          config:
            basePath: "./data/blobs"
            maxFileSize: "100mb"
        # --- Cloud provider blob options ---
        aws-s3:
          adapter: "@docket/blob-s3"
          config:
            endpoint: "${S3_ENDPOINT:-}"
            bucket: "${S3_BUCKET:-}"
            accessKeyId: "${S3_ACCESS_KEY:-}"
            secretAccessKey: "${S3_SECRET_KEY:-}"
            region: "${S3_REGION:-}"
        cloudflare-r2:
          adapter: "@docket/blob-s3"
          config:
            endpoint: "${R2_ENDPOINT:-}"
            bucket: "${R2_BUCKET:-}"
            accessKeyId: "${R2_ACCESS_KEY_ID:-}"
            secretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
            region: "auto"
        gcp-cloud-storage:
          adapter: "@docket/blob-gcs"
          config:
            projectId: "${GCP_PROJECT_ID:-}"
            bucket: "${GCS_BUCKET:-}"
        azure-blob:
          adapter: "@docket/blob-azure"
          config:
            connectionString: "${AZURE_STORAGE_CONNECTION_STRING:-}"
            containerName: "${AZURE_STORAGE_CONTAINER:-docket-blobs}"

    queue:
      default: "in-memory"
      providers:
        in-memory:
          adapter: "@docket/queue-memory"
          config:
            maxConcurrent: 5
            retryAttempts: 3
            retryDelay: 1000
        # --- Cloud provider queue options ---
        aws-sqs:
          adapter: "@docket/queue-sqs"
          config:
            region: "${AWS_REGION:-us-east-1}"
            queueUrl: "${SQS_QUEUE_URL:-}"
            accessKeyId: "${AWS_ACCESS_KEY_ID:-}"
            secretAccessKey: "${AWS_SECRET_ACCESS_KEY:-}"
        cloudflare-queues:
          adapter: "@docket/queue-cloudflare"
          config:
            accountId: "${CF_ACCOUNT_ID:-}"
            queueName: "${CF_QUEUE_NAME:-docket}"
            apiToken: "${CF_API_TOKEN:-}"
        redis:
          adapter: "@docket/queue-redis"
          config:
            url: "${REDIS_URL:-redis://localhost:6379}"
        gcp-pubsub:
          adapter: "@docket/queue-pubsub"
          config:
            projectId: "${GCP_PROJECT_ID:-}"
            topicName: "${PUBSUB_TOPIC:-docket}"
        azure-service-bus:
          adapter: "@docket/queue-service-bus"
          config:
            connectionString: "${AZURE_SERVICE_BUS_CONNECTION_STRING:-}"
            queueName: "${AZURE_SERVICE_BUS_QUEUE:-docket}"
